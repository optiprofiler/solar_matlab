name: Collect Info

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-info
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout OptiProfiler
        uses: actions/checkout@v4
        with:
          repository: optiprofiler/optiprofiler
          path: optiprofiler
          ref: main

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a

      - name: Regenerate MATLAB probinfo
        uses: matlab-actions/run-command@v2
        with:
          command: "run('scripts/collect_info.m')"

      - name: Upload probinfo artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-matlab-probinfo
          path: |
            probinfo_matlab.csv
            probinfo_matlab.mat
